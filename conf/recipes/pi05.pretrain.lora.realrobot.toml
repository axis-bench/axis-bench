schema = "qvla.recipe/1"
id = "pi05.pretrain.lora.realrobot"
backbone = "pi05-openpi"
stage = "pretrain"
track = "realrobot"
paper_budget = true
description = "Real-robot line, stage 1: LoRA on both experts with the vision tower frozen, from pi05_base on the re-rendered simulation demonstrations of qvla-v1-realworld, 20,000 steps at global batch 64, 1,000 warmup steps then cosine from 2.5e-5 to 2.5e-6, action horizon 15, centre-cropped 224 images. Trained by `qvla train` from the run specs `qvla realrobot pretrain` and `qvla realrobot finetune` write."
nulls = ["fields.ema_decay", "fields.data.default_prompt", "fields.data.quality_tag"]

[budget]
steps = 20000
global_batch = 64
per_rank_batch = 64
world = 1

[fields]
batch_size = 64
num_train_steps = 20000
"lr_schedule.warmup_steps" = 1000
"lr_schedule.peak_lr" = 2.5e-05
"lr_schedule.decay_steps" = 20000
"lr_schedule.decay_lr" = 2.5e-06
"optimizer.b1" = 0.9
"optimizer.b2" = 0.95
"optimizer.eps" = 1e-08
"optimizer.weight_decay" = 1e-10
"optimizer.clip_gradient_norm" = 1.0
"model.pi05" = true
"model.action_dim" = 32
"model.action_horizon" = 15
"model.max_token_len" = 200
"model.dtype" = "bfloat16"
"model.paligemma_variant" = "gemma_2b_lora"
"model.action_expert_variant" = "gemma_300m_lora"
"model.discrete_state_input" = true
"model.pytorch_compile_mode" = "max-autotune"
"data.image_center_crop" = true
"data.repo_id" = "qvla-v1-realworld"
"data.sim_image_aug" = true
"data.action_units" = "joint_velocity_rad_s_clipped_1"

[structure]
freeze = "lora_frozen_vision"
fsdp_devices = 8
num_workers = 8
save_interval = 5000
keep_period = 5000
log_interval = 100
prompt_from_task = true
