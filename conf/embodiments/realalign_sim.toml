schema = "qvla.embodiment/1"
id = "realalign_sim"
about = "The kinematic REALALIGN render's DROID-8D view (axis_qvla/realrobot/render/droid8d.py)."
fps = 15
[state]
stored = ["q0", "q1", "q2", "q3", "q4", "q5", "q6", "closedness"]
model = ["q0", "q1", "q2", "q3", "q4", "q5", "q6", "closedness"]
[action]
stored = ["dq0", "dq1", "dq2", "dq3", "dq4", "dq5", "dq6", "closedness"]
units = "joint_velocity_rad_s_clipped_1"   # forward difference x 15, clipped to +-1 rad/s
range = [-1.0, 1.0]
gripper_units = "closedness_0_1"           # gripper ctrl / 255
[images]
keys = ["observation.images.third_person", "observation.images.wrist"]
recorded = [640, 360]
stored = [640, 360]
geometry_default = "center_crop224"
