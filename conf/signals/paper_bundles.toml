# The paper's training signals as SignalBundles: one entry per distinct signal, and the arms that
# trained on it. `qvla signals build-paper` compiles every entry from the published corpus pack and
# the corpus metadata, refuses any bundle whose legacy export differs from its locked file
# (conf/release/SIGNALS.lock.json), and writes bundles/manifest.json (arm -> bundle id).
#
#   method     bc | awr_chunk | awr_episode | awr_imported | cfg | drop_top50 | random50
#   format     the legacy format the arm's consumer read (openpi-legacy for pi0.5, lerobot-legacy for
#              SmolVLA and X-VLA, which share every bundle because they read the same files)
#   source     the locked file the method imports its scores from (lock id)
#   rowspace   libero5k_v2_d8 (the 5,000-episode corpus), its .sub1000/.sub2500 scaling cuts, or
#              heldout24_ft (the finetune set's 86,912 frames)
#   budget     [optimizer steps, global batch]; seed is the planner's seed (the training seed for
#              permutation plans, the schedule's seed for filtering plans)
#   exports    the locked files this bundle writes back (lock ids)
schema = "qvla.paper_bundles/1"

